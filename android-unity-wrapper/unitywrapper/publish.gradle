apply plugin: 'maven-publish'
apply plugin: 'signing'

def isReleaseBuild() {
    return !VERSION_NAME.contains("-SNAPSHOT")
}



android {
    publishing {
        singleVariant("release") {
            // if you don't want sources/javadoc, remove these lines
            withJavadocJar()
        }
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                // The coordinates of the library
                groupId = GROUP
                artifactId = POM_ARTIFACT_ID
                version = VERSION_NAME

                // Artifacts to publish
                artifact("$buildDir/outputs/aar/${project.name}-release.aar")

                // Configure POM metadata
                pom {
                    name.set(POM_NAME)
                    description.set(POM_DESCRIPTION)
                    url.set(POM_URL)

                    licenses {
                        license {
                            name.set(POM_LICENCE_NAME)
                            url.set(POM_LICENCE_URL)
                            distribution.set(POM_LICENCE_DIST)
                        }
                    }

                    developers {
                        developer {
                            id.set(POM_DEVELOPER_ID)
                            name.set(POM_DEVELOPER_NAME)
                        }
                    }

                    scm {
                        connection.set(POM_SCM_CONNECTION)
                        developerConnection.set(POM_SCM_DEV_CONNECTION)
                        url.set(POM_SCM_URL)
                    }
                }

                // Add dependencies to the POM
                pom.withXml {
                    def root = asNode()
                    def dependenciesNode = root.appendNode('dependencies')
                    def managedNode = null
                    configurations.implementation.allDependencies.each { dependency ->
                        // platform(...) BOMs must be written as a dependencyManagement import,
                        // otherwise consumers treat the BOM as a plain library and the
                        // version-less dependencies below resolve to an empty version.
                        def isPlatform = dependency instanceof ModuleDependency &&
                                dependency.attributes.getAttribute(org.gradle.api.attributes.Category.CATEGORY_ATTRIBUTE)?.name ==
                                org.gradle.api.attributes.Category.REGULAR_PLATFORM
                        if (isPlatform) {
                            managedNode = managedNode ?: root.appendNode('dependencyManagement').appendNode('dependencies')
                            def bomNode = managedNode.appendNode('dependency')
                            bomNode.appendNode('groupId', dependency.group)
                            bomNode.appendNode('artifactId', dependency.name)
                            bomNode.appendNode('version', dependency.version)
                            bomNode.appendNode('type', 'pom')
                            bomNode.appendNode('scope', 'import')
                        } else {
                            def dependencyNode = dependenciesNode.appendNode('dependency')
                            dependencyNode.appendNode('groupId', dependency.group ?: '')
                            dependencyNode.appendNode('artifactId', dependency.name)
                            if (dependency.version) {
                                dependencyNode.appendNode('version', dependency.version)
                            }
                        }
                    }
                }
            }
        }


    }


    def decodedKey = project.findProperty("signing.secretKey")?.replace('\\n', '\n')

    signing {
        // 🧪 STEP 2: Use the decoded key INSIDE the signing block
        if (project.hasProperty("signing.keyId") &&
                decodedKey &&
                project.hasProperty("signing.password")) {

            useInMemoryPgpKeys(
                    project.findProperty("signing.keyId")?.toString(),
                    decodedKey,
                    project.findProperty("signing.password")?.toString()
            )
        }

        sign publishing.publications.release
    }
