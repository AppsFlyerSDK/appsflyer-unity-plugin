apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace "com.appsflyer.unitywrapper"
    compileSdkVersion 34

    defaultConfig {
        minSdkVersion 16
        targetSdkVersion 34

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    testOptions {
        unitTests {
            // android.jar's stub classes (e.g. android.util.Log) throw at runtime instead of
            // no-op'ing; plain JVM unit tests here have no Robolectric/Mockito shim for them.
            returnDefaultValues = true
        }
    }

}

repositories {
    mavenCentral()
}


dependencies {
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "com.appsflyer:af-android-plugin-bridge:7.0.12"
    compileOnly "com.appsflyer:af-android-sdk:$ANDROID_SDK_VERSION"
    compileOnly 'androidx.appcompat:appcompat:1.1.0'
    compileOnly "com.appsflyer:purchase-connector:$ANDROID_PC_VERSION"
    compileOnly 'com.android.billingclient:billing:8.0.0'
    testImplementation 'junit:junit:4.13.2'
    // android.jar's org.json classes are compile-only stubs that throw at runtime;
    // provide a real implementation for plain JVM unit tests.
    testImplementation 'org.json:json:20231013'
}

apply from: file('publish.gradle')
