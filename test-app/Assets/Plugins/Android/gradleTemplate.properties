org.gradle.jvmargs=-Xmx4096M
android.useAndroidX=true
android.enableJetifier=true
**ADDITIONAL_PROPERTIES**

# Mitigates AGP 8's namespace-uniqueness manifest merge check, which hard-fails because
# com.appsflyer:purchase-connector:2.3.0 and com.appsflyer:af-android-sdk:7.0.1 share the
# manifest package "com.appsflyer". This is the AGP 9.0-documented migration path for this
# property. Integrators using AppsFlyerPurchaseConnector must set this in their own project too.
android.uniquePackageNames=false
