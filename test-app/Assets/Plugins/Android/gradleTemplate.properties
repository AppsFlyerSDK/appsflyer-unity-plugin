org.gradle.jvmargs=-Xmx4096M
android.useAndroidX=true
android.enableJetifier=true
**ADDITIONAL_PROPERTIES**

# NOTE: com.appsflyer:purchase-connector:2.3.0 and com.appsflyer:af-android-sdk:7.0.1 share the
# manifest package "com.appsflyer", which AGP 8's mandatory namespace-uniqueness check hard-fails
# on. `android.uniquePackageNames` does NOT fix this (it's an older, unrelated naming-convention
# flag, not a namespace-uniqueness override) - there is currently no known consumer-side Gradle
# property that resolves this collision. Until AppsFlyer publishes these two artifacts with
# distinct namespaces upstream, purchase-connector is disabled in this project's dependencies
# (see Assets/AppsFlyer/Editor/AppsFlyerDependencies.xml) rather than shipped with a non-working
# workaround.
