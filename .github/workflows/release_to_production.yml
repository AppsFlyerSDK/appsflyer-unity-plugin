name: plugin release to Production

on:
  workflow_call:
    inputs:
      plugin_version:
        required: true
        type: string
      branch_name:
        required: true
        type: string
      package_artifact_name:
        required: true
        type: string
      source_ref:
        description: "Ref to check out (hotfix releases pass their branch)"
        required: false
        type: string
        default: master
      target_commitish:
        description: "Release target if the tag does not exist yet (hotfix releases pass their commit)"
        required: false
        type: string
        default: master
      make_latest:
        description: "Mark the release as Latest; hotfixes for an older line pass false"
        required: false
        type: boolean
        default: true

permissions:
  actions: read
  contents: write

jobs:
  Release-To-Production:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Configure git
        env:
          COMMIT_AUTHOR: ${{ secrets.CI_USERNAME }}
          COMMIT_EMAIL: ${{ secrets.CI_EMAIL }}
        run: |
          git config --global user.name "$COMMIT_AUTHOR"
          git config --global user.email "$COMMIT_EMAIL"

      - name: Download production packages
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.package_artifact_name }}
          path: .

      - name: Create production GitHub release with assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.plugin_version }}
          TAG: v${{ inputs.plugin_version }}
          TARGET: ${{ inputs.target_commitish }}
          MAKE_LATEST: ${{ inputs.make_latest }}
        run: |
          set -euo pipefail
          LATEST_ARG=()
          if [[ "$MAKE_LATEST" == "false" ]]; then
            LATEST_ARG=(--latest=false)
          fi
          REGULAR="appsflyer-unity-plugin-${VERSION}.unitypackage"
          STRICT="strict-mode-sdk/appsflyer-unity-plugin-strict-mode-${VERSION}.unitypackage"
          test -f "$REGULAR"
          test -f "$STRICT"

          NOTES_FILE="$(mktemp)"
          if [[ -f CHANGELOG.md ]]; then
            awk -v ver="v${VERSION}" '
              $0 == "## " ver { found=1; next }
              found && /^## / { exit }
              found && /^\* / { sub(/^\* /, ""); print "- " $0 }
              found && /^- / { print }
            ' CHANGELOG.md > "$NOTES_FILE" || true
          fi
          if [[ ! -s "$NOTES_FILE" ]]; then
            printf 'Unity plugin %s\n' "$VERSION" > "$NOTES_FILE"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "$TAG" \
              --notes-file "$NOTES_FILE" \
              --prerelease=false \
              "${LATEST_ARG[@]}"
          else
            gh release create "$TAG" \
              --target "$TARGET" \
              --title "$TAG" \
              --notes-file "$NOTES_FILE" \
              "${LATEST_ARG[@]}"
          fi

          gh release upload "$TAG" "$REGULAR" "$STRICT" --clobber
          rm -f "$NOTES_FILE"

          echo "Published $TAG with .unitypackage assets."
