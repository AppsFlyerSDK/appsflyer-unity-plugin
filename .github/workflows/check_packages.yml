name: check packages and release to upm

on:
  workflow_call:
    inputs:
      plugin_version:
        required: true
        type: string
      package_artifact_name:
        description: "Workflow artifact containing production-built Unity packages"
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: write

jobs:
  check-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Download production packages
        if: inputs.package_artifact_name != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.package_artifact_name }}
          path: .

      - name: get version
        run: | 
          echo "PLUGIN_VERSION=${{ inputs.plugin_version }}" >> "$GITHUB_ENV"
        
      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: install python packages
        run: |
          python -m pip install --upgrade pip
          pip install unitypackage_extractor
      - name: execute py script
        run:
          python .github/workflows/Scripts/extractPackage.py appsflyer-unity-plugin-${{env.PLUGIN_VERSION}}.unitypackage strict-mode-sdk/appsflyer-unity-plugin-strict-mode-${{env.PLUGIN_VERSION}}.unitypackage

      - name: validate production metadata
        run: |
          python .github/workflows/Scripts/validate-production-package.py \
            --version "${{ env.PLUGIN_VERSION }}" \
            --regular "appsflyer-unity-plugin-${{ env.PLUGIN_VERSION }}.unitypackage" \
            --strict "strict-mode-sdk/appsflyer-unity-plugin-strict-mode-${{ env.PLUGIN_VERSION }}.unitypackage"
          
  release-upm:
    runs-on: ubuntu-latest
    needs: check-packages
    steps:
      - uses: actions/checkout@v4
      - name: split branch
        env:
            COMMIT_AUTHOR: ${{ secrets.CI_USERNAME }}
            COMMIT_EMAIL: ${{ secrets.CI_EMAIL }}
        run: |
          git branch -d upm &> /dev/null || echo upm branch not found
          git subtree split -P Assets/AppsFlyer -b upm
          git checkout upm
          echo "Checked out to upm branch"
          git config --global user.name "$COMMIT_AUTHOR"
          git config --global user.email "$COMMIT_EMAIL"
          git rm -r Tests
          git commit -m "Remove Tests folder from upm branch"
          echo "Removed Tests folder"
          git push -f -u origin upm
      - name: create tag
        run: |
          git tag "v${{inputs.plugin_version}}"
          git push origin "v${{inputs.plugin_version}}"
          echo "Release v${{inputs.plugin_version}} to upm :bookmark:"


  strict-upm:
    runs-on: ubuntu-latest
    needs: check-packages
    steps:
      - uses: actions/checkout@v4
      - name: split branch
        env:
            COMMIT_AUTHOR: ${{ secrets.CI_USERNAME }}
            COMMIT_EMAIL: ${{ secrets.CI_EMAIL }}
        run: |
          git branch -d Strict-upm &> /dev/null || echo Strict-upm branch not found
          git subtree split -P Assets/AppsFlyer -b Strict-upm
          git checkout Strict-upm
          echo "Checked out to Strict-upm branch"
          git config --global user.name "$COMMIT_AUTHOR"
          git config --global user.email "$COMMIT_EMAIL"
          git rm -r Tests
          git commit -m "Remove Tests folder from Strict-upm branch"
          echo "Removed Tests folder"
      - name: Modify for strict mode
        run: |
          DEPS_XML=Editor/AppsFlyerDependencies.xml

          echo "Changing PurchaseConnector CocoaPod fallback to its strict-mode subspec"
          # PurchaseConnector has no Strict SPM product, so keep the CocoaPods subspec swap for
          # its iosPod fallback below, but drop its remoteSwiftPackage block entirely: EDM4U's
          # SwiftPackageManager.AddPackagesToProject() adds every declared remoteSwiftPackage
          # unconditionally, so leaving it in place would add the regular PurchaseConnector SPM
          # package alongside the PurchaseConnector/Strict CocoaPod.
          grep -q 'name="PurchaseConnector"' "$DEPS_XML"
          sed -i 's|name="PurchaseConnector"|name="PurchaseConnector/Strict"|g' "$DEPS_XML"
          sed -i '/<remoteSwiftPackage url="https:\/\/github.com\/AppsFlyerSDK\/PurchaseConnector-Dynamic.git"/,/<\/remoteSwiftPackage>/d' "$DEPS_XML"

          echo "Swapping AppsFlyerRPC and AppsFlyerFramework SPM packages to their strict-mode products"
          # The iosPod names for AppsFlyerRPC/AppsFlyerFramework are left unchanged so they keep
          # matching their remoteSwiftPackage's replacesPod value: EDM4U's podsToIgnore check
          # (IOSResolver.GenPodfile) is an exact string compare against the iosPod's current
          # name, so renaming the iosPod here (as PurchaseConnector's does) would break that
          # match and cause both the CocoaPod and the SPM package to be added.
          grep -q '<swiftPackage name="AppsFlyerRPC" replacesPod="AppsFlyerRPC"/>' "$DEPS_XML"
          sed -i 's|<swiftPackage name="AppsFlyerRPC" replacesPod="AppsFlyerRPC"/>|<swiftPackage name="AppsFlyerRPCStrict" replacesPod="AppsFlyerRPC"/>|' "$DEPS_XML"
          grep -q 'url="https://github.com/AppsFlyerSDK/AppsFlyerFramework-Dynamic.git"' "$DEPS_XML"
          sed -i 's|url="https://github.com/AppsFlyerSDK/AppsFlyerFramework-Dynamic.git"|url="https://github.com/AppsFlyerSDK/AppsFlyerFramework-Strict.git"|' "$DEPS_XML"
          sed -i 's|<swiftPackage name="AppsFlyerLib-Dynamic" replacesPod="AppsFlyerFramework"/>|<swiftPackage name="AppsFlyerLib" replacesPod="AppsFlyerFramework"/>|' "$DEPS_XML"

          echo "Changing package.json to Strict Mode"
          grep -q "AppsFlyer Unity plugin" ./package.json
          sed -i 's/AppsFlyer Unity plugin/AppsFlyer Unity plugin strict mode/g' ./package.json

      - name: Commit changes and push
        env:
            COMMIT_AUTHOR: ${{ secrets.CI_USERNAME }}
            COMMIT_EMAIL: ${{ secrets.CI_EMAIL }}
        run: |
          git config user.name "$COMMIT_AUTHOR"
          git config user.email "$COMMIT_EMAIL"
          git add -A
          git commit -m "update package.json"
          git push -f -u origin Strict-upm
      - name: create tag
        run: |
          git tag "Strict-v${{inputs.plugin_version}}"
          git push origin "Strict-v${{inputs.plugin_version}}"
          echo "Release Strict mode v${{inputs.plugin_version}} to upm :bookmark:"
      
     
