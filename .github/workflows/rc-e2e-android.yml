name: RC E2E — Android (reusable)

on:
  workflow_call:
    inputs:
      plugin_version:
        description: RC plugin version (e.g. 6.18.0-rc1)
        required: true
        type: string
      release_branch:
        description: Release branch to check out
        required: true
        type: string
      package_artifact_name:
        description: Workflow artifact containing generated Unity packages
        required: true
        type: string
      package_file_name:
        description: Regular .unitypackage file name inside the artifact
        required: true
        type: string
      plan_path:
        description: Scenario plan to run
        required: false
        default: .af-e2e/test-plan.json
        type: string
      report_artifact_prefix:
        description: Prefix for uploaded report artifacts
        required: false
        default: e2e
        type: string
    secrets:
      UNITY_EMAIL:
        required: true
      UNITY_PASSWORD:
        required: true
      UNITY_SERIAL:
        required: true
      ENV_FILE:
        required: true

jobs:
  build-apk:
    name: Build Android APK — ${{ inputs.plugin_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_branch }}

      - name: Download generated Unity package
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.package_artifact_name }}
          path: .af-artifacts

      - name: Import generated package into test app
        run: |
          python3 scripts/import-unity-package.py \
            --package ".af-artifacts/${{ inputs.package_file_name }}" \
            --project test-app \
            --remove-manifest-dependency appsflyer-unity-plugin \
            --clean Assets/AppsFlyer

      - name: Write .env from secret
        run: |
          mkdir -p test-app/Assets/StreamingAssets
          printf '%s' "${{ secrets.ENV_FILE }}" > test-app/Assets/StreamingAssets/.env

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: test-app/Library
          key: unity-android-library-6000.3.5f1-${{ hashFiles('test-app/Assets/**', 'test-app/Packages/**', 'test-app/ProjectSettings/**') }}
          restore-keys: |
            unity-android-library-6000.3.5f1-

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL:   ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion:   6000.3.5f1
          targetPlatform: Android
          customImage:    ghcr.io/appsflyersdk/unity-android:ubuntu-6000.3.5f1-android-3
          projectPath:    test-app
          buildMethod:    BuildScript.BuildAndroid
          buildsPath:     test-app/Build
          allowDirtyBuild: true
        timeout-minutes: 60

      - name: Upload Unity build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-build-log-${{ inputs.plugin_version }}
          path: /tmp/unity-build.log
          retention-days: 3

      - name: Locate APK
        run: |
          APK=$(find test-app/Build -name "*.apk" | head -1)
          if [[ -z "$APK" ]]; then
            echo "::error::APK not found after Unity build"
            exit 1
          fi
          mkdir -p .af-artifacts/apk
          cp "$APK" .af-artifacts/apk/app.apk

      - name: Upload built APK
        uses: actions/upload-artifact@v4
        with:
          name: built-apk-${{ inputs.plugin_version }}
          path: .af-artifacts/apk/app.apk
          retention-days: 3

  e2e-android:
    name: E2E Android — ${{ inputs.plugin_version }}
    needs: build-apk
    # Runs on the local Apple Silicon self-hosted runner so the emulator matches local dev
    # conditions natively (arm64-v8a, HVF-accelerated) instead of GH-hosted x86_64 + ABI
    # translation, which was implicated in the intermittent start()/conversion-callback
    # failures seen on GH-hosted runners.
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_branch }}

      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: built-apk-${{ inputs.plugin_version }}
          path: .af-artifacts/apk

      - name: Locate APK
        run: |
          APK=".af-artifacts/apk/app.apk"
          if [[ ! -f "$APK" ]]; then
            echo "::error::APK not found in downloaded artifact"
            exit 1
          fi
          # af-scenario-runner.sh reads config.android.apk_path from the plan JSON
          # (test-app/Build/Android/com.appsflyer.engagement.apk, shared with local dev
          # runs and .af-smoke/rc-test-plan.json) rather than $APK_PATH — place the
          # downloaded artifact there too so requires_fresh_install's re-install inside
          # run_phase() finds it instead of failing with "APK not found".
          mkdir -p test-app/Build/Android
          cp "$APK" test-app/Build/Android/com.appsflyer.engagement.apk
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Ensure jq is available
        run: command -v jq >/dev/null 2>&1 || brew install jq

      - name: Pin AppsFlyer-host DNS resolution
        run: |
          for host in oyoxfj.conversions.appsflyersdk.com t.appsflyer.com conversions.appsflyer.com; do
            echo "--- nslookup $host ---"
            nslookup "$host" 8.8.8.8 || true
          done

      - name: Run E2E scenario runner inside Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          AF_QA_POST_MARKER_WAIT_SEC: "30"
        with:
          # Matches the local Pixel 9 Pro AVD (arm64-v8a, google_apis_playstore, API 36) now that
          # this job runs on Apple Silicon hardware with native HVF acceleration — no x86_64/ABI
          # translation layer, unlike the GH-hosted runner this job replaced for E2E.
          api-level: 36
          arch: arm64-v8a
          target: google_apis_playstore
          profile: pixel_9_pro
          emulator-options: -dns-server 8.8.8.8,1.1.1.1 -no-window -no-snapshot -no-boot-anim -accel on
          disable-animations: true
          script: |
            # IMPORTANT: this action runs EACH LINE of `script:` as its own
            # separate `sh -c` invocation, not as one continuous shell script.
            # That means multi-line constructs (brace groups, if/else spanning
            # lines) and cross-line shell variables (e.g. `$!` captured on one
            # line and read on the next) silently don't work — every line
            # after the first is a brand-new process with no memory of the
            # previous line's shell state. Each line below is written to be a
            # fully self-contained statement for that reason.
            set +e
            mkdir -p .af-e2e/reports .af-smoke/reports
            adb wait-for-device
            adb root || true
            adb wait-for-device
            # Wait for Play Store to be up before installing - avoids racing its post-boot self-update.
            timeout 120 sh -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ] && adb shell pidof com.android.vending >/dev/null 2>&1; do sleep 3; done' || echo "::warning::Play Store did not report ready within 120s; proceeding anyway"
            sleep 15
            adb logcat -c
            nohup adb logcat > .af-e2e/reports/device-logcat-full.txt 2>&1 &
            { echo "=== adb install -r \"$APK_PATH\" ==="; adb install -r "$APK_PATH"; } > .af-e2e/reports/adb-install.log 2>&1; INSTALL_EXIT=$?; cat .af-e2e/reports/adb-install.log; if [ $INSTALL_EXIT -ne 0 ]; then echo "::error::adb install failed with exit $INSTALL_EXIT — see adb-install.log and device-logcat-full.txt in the uploaded report artifact"; RUNNER_EXIT=$INSTALL_EXIT; else adb shell am force-stop com.appsflyer.engagement; chmod +x scripts/af-scenario-runner.sh; scripts/af-scenario-runner.sh --platform android --plan "${{ inputs.plan_path }}" --verbose; RUNNER_EXIT=$?; fi; pkill -f "adb .*logcat" >/dev/null 2>&1; exit $RUNNER_EXIT

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.report_artifact_prefix }}-android-report-${{ inputs.plugin_version }}
          path: |
            .af-e2e/reports/
            .af-smoke/reports/
          include-hidden-files: true
          retention-days: 30
